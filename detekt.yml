comments:
  OutdatedDocumentation:
    active: true
    allowParamOnConstructorProperties: true
    matchTypeParameters: true
    matchDeclarationsOrder: true
  UndocumentedPublicClass:
    active: true
    includes:
    - '**/*.kt'
  UndocumentedPublicFunction:
    active: true
    includes:
    - '**/*.kt'
  UndocumentedPublicProperty:
    active: true
    includes:
    - '**/*.kt'
naming:
  FunctionNaming:
    active: false
complexity:
  TooManyFunctions:
    active: true
    excludes:
    - '**/*'
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11
    ignoreAnnotated: []
  LongMethod:
    active: true
    ignoreAnnotated:
    - Composable
  LongParameterList:
    active: true
    ignoreAnnotated:
    - Composable
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated:
    - Composable
