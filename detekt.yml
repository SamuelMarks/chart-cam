comments:
  OutdatedDocumentation:
    active: true
    allowParamOnConstructorProperties: true
    matchTypeParameters: true
    matchDeclarationsOrder: true
  UndocumentedPublicClass:
    active: true
    includes:
    - '**/*.kt'
  UndocumentedPublicFunction:
    active: true
    includes:
    - '**/*.kt'
  UndocumentedPublicProperty:
    active: true
    includes:
    - '**/*.kt'
naming:
  FunctionNaming:
    active: false
complexity:
  TooManyFunctions:
    active: true
    excludes:
    - '**/*'
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false
    allowedFunctionsPerFile: 11
    allowedFunctionsPerClass: 11
    allowedFunctionsPerInterface: 11
    allowedFunctionsPerObject: 11
    allowedFunctionsPerEnum: 11
    ignoreAnnotated: []
  LargeClass:
    active: true
    excludes:
    - '**/SdcEvaluator.kt'
    - '**/FhirRepository.kt'
  LongMethod:
    active: true
    ignoreAnnotated:
    - Composable
  LongParameterList:
    active: true
    ignoreAnnotated:
    - Composable
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated:
    - Composable
style:
  MagicNumber:
    active: true
    ignoreNumbers:
    - '-1'
    - '0'
    - '1'
    - '2'
    - '0.0'
    - '1.0'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreAnnotated:
    - Composable
    - Preview
    excludes:
    - '**/ui/theme/**'
    - '**/ui/sdc/controls/**'
    - '**/models/VisualFormModels.kt'
