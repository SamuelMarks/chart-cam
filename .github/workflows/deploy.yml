name: ChartCam CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  NODE_OPTIONS: "--max-old-space-size=3072"

jobs:
  # --- Job 1: Check and Test (Fast Linux Runner) ---
  check_and_test:
    name: Unit Tests & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        
      - name: Run KMP Tests (Android/JVM/Common)
        run: ./gradlew test

  # --- Job 2: Deploy Android (Ubuntu) ---
  deploy_android:
    name: Deploy Android Internal
    needs: [check_and_test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/master' # Only deploy on main merge
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: fastlane

      - name: Verify Required Secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PLAY_STORE_JSON_B64: ${{ secrets.PLAY_STORE_JSON_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing_secrets=()
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then missing_secrets+=("ANDROID_KEYSTORE_B64"); fi
          if [ -z "$PLAY_STORE_JSON_B64" ]; then missing_secrets+=("PLAY_STORE_JSON_B64"); fi
          if [ -z "$ANDROID_STORE_PASSWORD" ]; then missing_secrets+=("ANDROID_STORE_PASSWORD"); fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then missing_secrets+=("ANDROID_KEY_ALIAS"); fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then missing_secrets+=("ANDROID_KEY_PASSWORD"); fi
          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub Secrets for Android deployment: ${missing_secrets[*]}"
            echo "Please define these in the GitHub repository settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Decode Play Store API Key
        env:
          PLAY_STORE_JSON_B64: ${{ secrets.PLAY_STORE_JSON_B64 }}
        run: |
          echo "$PLAY_STORE_JSON_B64" | base64 --decode > api-key.json

      - name: Fastlane Android Deploy
        env:
          ANDROID_STORE_FILE: ../release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: fastlane
        run: bundle exec fastlane android deploy_internal

  # --- Job 3: Deploy iOS (MacOS - Expensive, run sparingly) ---
  deploy_ios:
    name: Deploy iOS TestFlight
    needs: [check_and_test]
    runs-on: macos-15
    timeout-minutes: 30
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: fastlane

      - name: Verify Required Secrets
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing_secrets=()
          if [ -z "$MATCH_PASSWORD" ]; then missing_secrets+=("MATCH_PASSWORD"); fi
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then missing_secrets+=("APP_STORE_CONNECT_API_KEY"); fi
          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub Secrets for iOS deployment: ${missing_secrets[*]}"
            echo "Please define these in the GitHub repository settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Disable Gradle Daemon
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          sed -i '' 's/-XX:MaxRAMPercentage=50.0/-Xmx13g/g' gradle.properties

      - name: Fastlane iOS Deploy
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        working-directory: fastlane
        run: bundle exec fastlane ios deploy_testflight
