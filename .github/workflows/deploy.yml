name: ChartCam CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  NODE_OPTIONS: "--max-old-space-size=3072"

jobs:
  # --- Job 1: Check and Test (Fast Linux Runner) ---
  check_and_test:
    name: Unit Tests & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6
        
      - name: Run KMP Tests (Android/JVM/Common)
        run: ./gradlew test

  # --- Job 1.5: Check for Secrets Availability ---
  check_secrets:
    name: Check Secrets Availability
    runs-on: ubuntu-latest
    outputs:
      has_android_secrets: ${{ steps.check.outputs.has_android_secrets }}
      has_ios_secrets: ${{ steps.check.outputs.has_ios_secrets }}
    steps:
      - name: Verify Deployment Secrets
        id: check
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PLAY_STORE_JSON_B64: ${{ secrets.PLAY_STORE_JSON_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$PLAY_STORE_JSON_B64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "has_android_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android_secrets=false" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -n "$MATCH_PASSWORD" ] && [ -n "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "has_ios_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ios_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  # --- Job 2: Deploy Android (Ubuntu) ---
  deploy_android:
    name: Deploy Android Internal
    needs: [check_and_test, check_secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/master' && needs.check_secrets.outputs.has_android_secrets == 'true'
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: fastlane

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Decode Play Store API Key
        env:
          PLAY_STORE_JSON_B64: ${{ secrets.PLAY_STORE_JSON_B64 }}
        run: |
          echo "$PLAY_STORE_JSON_B64" | base64 --decode > api-key.json

      - name: Fastlane Android Deploy
        env:
          ANDROID_STORE_FILE: ../release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: fastlane
        run: bundle exec fastlane android deploy_internal

  # --- Job 3: Deploy iOS (MacOS - Expensive, run sparingly) ---
  deploy_ios:
    name: Deploy iOS TestFlight
    needs: [check_and_test, check_secrets]
    runs-on: macos-15
    timeout-minutes: 30
    if: github.ref == 'refs/heads/master' && needs.check_secrets.outputs.has_ios_secrets == 'true'
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: fastlane

      - name: Disable Gradle Daemon
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          sed -i '' 's/-XX:MaxRAMPercentage=50.0/-Xmx13g/g' gradle.properties

      - name: Fastlane iOS Deploy
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        working-directory: fastlane
        run: bundle exec fastlane ios deploy_testflight