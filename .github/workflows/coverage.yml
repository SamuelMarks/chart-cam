name: Coverage Verification

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  NODE_OPTIONS: "--max-old-space-size=3072"

jobs:
  verify_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Tests, Check Coverage, and Lint
        run: ./gradlew check :chartCam:koverVerify :chartCam:koverXmlReport detekt

      - name: Run Python Coverage Check
        run: python3 scripts/check_coverage.py
      - name: Run Composable Docs Check
        run: python3 scripts/check_composable_docs.py
      - name: Run Param/Return Check
        run: python3 scripts/check_param_return.py
      - name: Run Test Coverage Check
        run: python3 scripts/test_cov.py
      - name: Run i18n Completeness Check
        run: python3 scripts/test_i18n.py
