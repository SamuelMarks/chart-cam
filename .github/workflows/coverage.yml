name: Coverage Verification

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  verify_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Tests, Check Coverage, and Lint
        run: ./gradlew check :chartCam:koverVerify detekt

      - name: Run Python Coverage Check
        run: python3 scripts/check_coverage.py
