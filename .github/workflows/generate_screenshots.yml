name: Generate Screenshots

on:
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '**/AndroidScreenshotGeneratorTest.*'

jobs:
  generate-android-screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Run Android Emulator and Generate Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            ./gradlew :androidApp:connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.healthplatform.chartcam.AndroidScreenshotGeneratorTest
            mkdir -p fastlane/screenshots/en-US
            adb pull /sdcard/Android/data/io.healthplatform.chartcam.test/cache/screenshots/ fastlane/screenshots/en-US/ || true
            adb pull /sdcard/Android/data/io.healthplatform.chartcam/cache/screenshots/ fastlane/screenshots/en-US/ || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: fastlane/screenshots/en-US/

