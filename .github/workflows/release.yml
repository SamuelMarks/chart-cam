name: Create GitHub Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v', e.g., v1.0.0, v2.1-beta

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build-and-release:
    name: Build Artifacts & Create Release
    runs-on: ubuntu-latest
    
    # Required to create a GitHub Release
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease

      - name: Build Desktop JAR
        # Builds a standalone Uber JAR for desktop
        run: ./gradlew :chartCam:packageReleaseUberJarForCurrentOS

      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          # Copy and rename Android APKs
          cp androidApp/build/outputs/apk/debug/*.apk release-artifacts/ChartCam-Android-Debug.apk || echo "Android Debug APK not found"
          cp androidApp/build/outputs/apk/release/*-unsigned.apk release-artifacts/ChartCam-Android-Release-Unsigned.apk || echo "Android Release APK not found"
          
          # Copy and rename Desktop JAR
          cp chartCam/build/compose/jars/*.jar release-artifacts/ChartCam-Desktop.jar || echo "Desktop JAR not found"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Automatically use the tag name for the release name
          name: Release ${{ github.ref_name }}
          # You can add generated release notes automatically
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS & Append to Release
    needs: build-and-release
    runs-on: macos-15
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build iOS App (Unsigned)
        run: |
          cd iosApp
          # Compile the app without code signing for sideloading/GH Release
          xcodebuild -scheme iosApp -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          
          # Package the .app into a standard .ipa
          mkdir -p Payload
          cp -r build/Release-iphoneos/iosApp.app Payload/
          zip -r ../ChartCam-iOS-Unsigned.ipa Payload

      - name: Publish iOS Artifact to Release
        uses: softprops/action-gh-release@v3
        with:
          files: ChartCam-iOS-Unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
