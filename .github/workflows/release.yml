name: Create GitHub Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v', e.g., v1.0.0, v2.1-beta

jobs:
  build-android:
    name: Build Android & Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease

      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          cp androidApp/build/outputs/apk/debug/*.apk release-artifacts/ChartCam-Android-Debug.apk || echo "Android Debug APK not found"
          cp androidApp/build/outputs/apk/release/*-unsigned.apk release-artifacts/ChartCam-Android-Release-Unsigned.apk || echo "Android Release APK not found"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build Desktop JARs
    needs: build-android
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: Linux
          - os: macos-latest
            suffix: macOS
          - os: windows-latest
            suffix: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Desktop JAR
        run: ./gradlew :chartCam:packageReleaseUberJarForCurrentOS

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp chartCam/build/compose/jars/*.jar release-artifacts/ChartCam-Desktop-${{ matrix.suffix }}.jar || echo "Desktop JAR not found"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS & Append to Release
    needs: build-android
    runs-on: macos-15
    timeout-minutes: 30
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Disable Gradle Daemon
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Build iOS App (Unsigned)
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild -scheme iosApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | xcbeautify
          
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r ../ChartCam-iOS-Unsigned.ipa Payload

      - name: Publish iOS Artifact to Release
        uses: softprops/action-gh-release@v3
        with:
          files: ChartCam-iOS-Unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
