#Kotlin
kotlin.code.style=official
kotlin.daemon.jvm.options=-Xmx16g
kotlin.native.jvm.options=-Xmx16g
kotlin.native.jvmArgs=-Xmx16g
org.jetbrains.kotlin.native.jvmArgs=-Xmx16g

#Gradle
org.gradle.jvmargs=-Xmx16g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.native.disableCompilerDaemon=false
org.gradle.workers.max=2
